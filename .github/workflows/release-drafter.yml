name: Release Drafter

# Two triggers, one step each:
#   - push to main runs the drafter: it updates the draft release body and
#     resolves the next version from the labels of PRs merged since the last
#     release.
#   - pull_request_target runs the autolabeler so PRs are categorized BEFORE
#     they merge. pull_request_target uses the base branch's workflow + the
#     base branch's release-drafter.yml, so a malformed config in a PR cannot
#     break labeling.
#
# release-drafter v7 split these into two actions: the root action drafts and
# nothing else, while autolabeling moved to the `autolabeler/` sub-action.
# Both read the same `.github/release-drafter.yml`, including its
# `autolabeler:` block. A v6-style single step silently stops labeling -- the
# drafter does not warn about the config key it no longer owns -- so keep both
# steps, and bump them together.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: release-drafter/release-drafter/autolabeler@v7
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
